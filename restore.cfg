# Klipper macro — trigger a Git restore from the printer UI.
# This file is generated by menu.sh during setup. The path below is set to
# the home directory of the user who ran the setup wizard.
#
# WARNING: running RESTORE will overwrite your current config with the
# latest version from your remote repository. A Klipper restart is required
# after restore for changes to take effect.

[gcode_shell_command restore_from_git]
command: bash /home/replaceme/restore_command.sh
timeout: 300.
verbose: True

[gcode_macro RESTORE]
gcode:
    RUN_SHELL_COMMAND CMD=restore_from_git
