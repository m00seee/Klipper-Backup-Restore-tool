# Klipper macro — trigger a Git backup from the printer UI or a print macro.
# This file is generated by menu.sh during setup. The path below is set to
# the home directory of the user who ran the setup wizard.
#
# To trigger from a print macro, add:
#   BACKUP
# at the end of your START_PRINT or END_PRINT gcode.

[gcode_shell_command backup_to_git]
command: bash /home/replaceme/backup_command.sh
timeout: 300.
verbose: True

[gcode_macro BACKUP]
gcode:
    RUN_SHELL_COMMAND CMD=backup_to_git
